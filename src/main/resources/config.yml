debug: false

database:
  type: sqlite
  host: localhost
  port: 3306
  database: progresstree
  username: root
  password: ""

settings:
  check-interval: 60
  community-reward-broadcast: true

messages:
  prefix: "&8[&bProgressTree&8] "
  milestone-available: "&aMilestone available! Click to claim."
  milestone-locked: "&cThis milestone is still locked."
  milestone-claimed: "&eReward claimed: %reward%"
  no-milestone: "&cNo milestone available."
  player-not-found: "&cPlayer not found."
  config-reloaded: "&aConfiguration reloaded successfully."
  no-permission: "&cYou don't have permission."
  already-claimed: "&cThis milestone has already been claimed."
  milestone-claimed-self: "&eYou claimed: %reward%"
  data-loading: "&7Loading your progress data..."
  migration-success: "&aMigration completed successfully!"
  migration-failed: "&cMigration failed. Check console for details."

gui:
  title: "&8ProgressTree"
  available-color: "&a"
  locked-color: "&7"
  claimed-color: "&e"
  claim-button: "&aClick to Claim"
  choose-button: "&eChoose Reward"

  # Tree layout template — EXACT pyramid pattern (13 milestones/page)
  # Row 0: 1 node (center apex)
  # Row 1: 3 nodes (left, center, right)
  # Row 2: 4 nodes (far-left, mid-left, mid-right, far-right)
  # Row 3: 5 nodes (full width base)
  # Nav bar on row 5 (slots 45-53)
  layout-template:
    - 4      # row 0: center apex
    - 11     # row 1: left
    - 13     # row 1: center
    - 15     # row 1: right
    - 19     # row 2: far-left
    - 21     # row 2: mid-left
    - 23     # row 2: mid-right
    - 25     # row 2: far-right
    - 27     # row 3: anchor left
    - 29     # row 3: anchor mid-left
    - 31     # row 3: anchor center
    - 33     # row 3: anchor mid-right
    - 35     # row 3: anchor right

  # Navigation bar (row 5, bottom of 54-slot chest)
  navigation:
    prev-page-slot: 45
    player-info-slot: 47
    page-indicator-slot: 49
    close-slot: 51
    next-page-slot: 53

  # Filler items between tree nodes (glass panes as "branches")
  branch-filler:
    material: GRAY_STAINED_GLASS_PANE
    name: " "

  # Progress bar in lore
  progress-bar:
    segments: 20
    filled-char: "▰"
    empty-char: "▱"
    filled-color: "&b"
    empty-color: "&8"

